<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <div class="header">
        <h1>My Tasks</h1>
        <p class="date" id="dateDisplay"></p>
    </div>

    <div class="stats">
        <span id="totalCount">0 tasks</span>
        <span id="doneCount">0 done</span>
    </div>

    <div class="input-row">
        <input type="text" id="taskInput" placeholder="Add a new task..." maxlength="80">
        <button onclick="addTask()">Add</button>
    </div>

    <ul class="task-list" id="taskList"></ul>

    <p class="empty-msg" id="emptyMsg">No tasks yet. Add one above!</p>

</div>

<script src="script.js"></script>
</body>
</html>
